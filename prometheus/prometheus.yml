global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification:8081

  - job_name: "task-manager"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - application:8080